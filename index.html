<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>♥</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
body{
  display:grid;place-items:center;
  font-family:'Changa',sans-serif;
  cursor:default;user-select:none;
}
.glow{
  position:relative;
  font-size:clamp(38px,11vw,120px);
  font-weight:800;
  letter-spacing:.02em;
  color:#FF0033;
  text-shadow:
    0 0 6px  #FF0033,
    0 0 18px #FF0033,
    0 0 40px #FF0033,
    0 0 80px rgba(255,0,51,.75),
    0 0 140px rgba(255,0,51,.45);
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{
    opacity:1;
    text-shadow:
      0 0 6px  #FF0033,
      0 0 18px #FF0033,
      0 0 40px #FF0033,
      0 0 80px rgba(255,0,51,.75),
      0 0 140px rgba(255,0,51,.45);
  }
  50%{
    opacity:.93;
    text-shadow:
      0 0 4px  #FF0033,
      0 0 12px #FF0033,
      0 0 28px #FF0033,
      0 0 55px rgba(255,0,51,.55),
      0 0 100px rgba(255,0,51,.3);
  }
}
/* faint red haze behind the text */
.halo{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,0,51,.09), transparent 55%);
}
</style>
</head>
<body>
  <div class="halo"></div>
  <h1 class="glow">بحبك يا قمر</h1>
</body>
</html>
